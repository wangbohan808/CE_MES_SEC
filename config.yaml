# -----------------------------------------------------------------------------
# §022  device_type=022  Omini 基站过水测试
# -----------------------------------------------------------------------------
# #[OMINIWATER-022-PROTO] 0x77 数据区 22 字节；0x88：03=正常结束  04=通讯失败
#
# 【逐项跳过 — 不显示 UI】（修改后重启程序）
#   测试项              配置键                                      跳过操作
#   清水通路过水        ominiwater_clear_volume_expected            # 注释 或写 -1
#   污水通路过水        ominiwater_duty_volume_expected             # 注释 或写 -1
#   左拖布过水          ominiwater_left_mop_volume_expected         # 注释 或写 -1
#   右拖布过水          ominiwater_right_mop_volume_expected        # 注释 或写 -1
#   清洁剂液位          ominiwater_cleaner_level_expected           # 注释 或写 -1（跳过后不再提示插/取清洁液）
#   左拖布温度 ADC      ominiwater_left_mop_temp_min / _max         两行都 # 或都写 0
#   右拖布温度 ADC      ominiwater_right_mop_temp_min / _max        两行都 # 或都写 0
#   基站热水温度 ADC    ominiwater_base_hot_temp_min / _max         两行都 # 或都写 0
#   基站版本            公共 mcu_version                            # 注释 或 ""
#
# 示例 — 跳过左拖布过水：
#   # ominiwater_left_mop_volume_expected: 3

# ominiwater_clear_volume_expected: 3       # 清水通路过水；【跳过】# 注释 或写 -1
ominiwater_duty_volume_expected: 3        # 污水通路过水；【跳过】# 注释 或写 -1
ominiwater_left_mop_volume_expected: 3    # 左拖布过水；【跳过】# 注释 或写 -1
ominiwater_right_mop_volume_expected: 3   # 右拖布过水；【跳过】# 注释 或写 -1
# ominiwater_cleaner_level_expected: 3      # 清洁剂液位；【跳过】# 注释 或写 -1
# ominiwater_left_mop_temp_min: 800         # 左拖布温度下限；【跳过】与 max 成对 # 或都写 0
# ominiwater_left_mop_temp_max: 1800        # 左拖布温度上限；【跳过】与 min 成对 # 或都写 0
# ominiwater_right_mop_temp_min: 800        # 右拖布温度下限；【跳过】与 max 成对 # 或都写 0
# ominiwater_right_mop_temp_max: 1800       # 右拖布温度上限；【跳过】与 min 成对 # 或都写 0
# ominiwater_base_hot_temp_min: 600         # 基站热水温度下限；【跳过】与 max 成对 # 或都写 0
# ominiwater_base_hot_temp_max: 130000      # 基站热水温度上限；【跳过】与 min 成对 # 或都写 0

# -----------------------------------------------------------------------------
# §016  device_type=016  RV50 基站过水测试
# -----------------------------------------------------------------------------
# #[RV50-016-WATER-PROTO] 0x77 数据区 24 字节（dat[22~23]=主机注水口热水温度 ADC）；0x88：03=正常结束  04=通讯失败
#
# ==========【工人必读】四路过水水量 — 两种模式二选一（改完保存并重启）==========
# 规则：区间(min/max) 优先于 精确(expected)。同一路不要两种都开。
#
# 【模式A｜旧逻辑｜多数项目】实测 == expected（常见填 3）
#   1) expected 写成 3（或其它期望值）
#   2) 对应 min 与 max 都写成 0（关掉区间）
#   界面显示「xxx水量：」；跳过该路 → expected 写 -1（或 # 注释）且 min/max 为 0
#   示例（整段替换下面「当前生效」水量配置即可）：
#     rv50water_clear_volume_expected: 3
#     rv50water_duty_volume_expected: 3
#     rv50water_left_mop_volume_expected: 3
#     rv50water_right_mop_volume_expected: 3
#     rv50water_clear_volume_min: 0
#     rv50water_clear_volume_max: 0
#     rv50water_duty_volume_min: 0
#     rv50water_duty_volume_max: 0
#     rv50water_left_mop_volume_min: 0
#     rv50water_left_mop_volume_max: 0
#     rv50water_right_mop_volume_min: 0
#     rv50water_right_mop_volume_max: 0
#
# 【模式B｜mL 区间｜需要真实水量判据的项目】min ≤ 实测 ≤ max（单位 mL，两字节 u16）
#   1) expected 写成 -1（或 # 注释掉 expected 行）
#   2) min/max 写成区间，如 100 / 1000；四路可各自不同
#   界面显示「xxx水量(mL)：」；跳过该路 → 该路 min 与 max 都写 0
#   （下方「当前生效」即为模式B 示例）
#
# 【其它测试项跳过】
#   清洁剂液位          rv50water_cleaner_level_expected            # 注释 或写 -1
#   左拖布温度 ADC      rv50water_left_mop_temp_min / _max          min 与 max 都写 0
#   右拖布温度 ADC      rv50water_right_mop_temp_min / _max         同上
#   基站热水温度 ADC    rv50water_base_hot_temp_min / _max          同上
#   主机注水口热水温度  rv50water_host_hot_temp_min / _max          同上
#   基站版本            公共 mcu_version                            # 注释 或 ""
# ==============================================================================

# ----- 水量：当前生效 = 模式B（mL 区间 100~1000）。若要改回模式A，见上方注释示例 -----
rv50water_clear_volume_expected: -1       # 模式A 时改为 3；模式B 保持 -1
rv50water_duty_volume_expected: -1        # 同上
rv50water_left_mop_volume_expected: -1    # 同上
rv50water_right_mop_volume_expected: -1   # 同上
rv50water_clear_volume_min: 100           # 模式B：清水下限(mL)；关掉区间 → 与 max 都写 0
rv50water_clear_volume_max: 1000          # 模式B：清水上限(mL)
rv50water_duty_volume_min: 100            # 模式B：污水下限(mL)
rv50water_duty_volume_max: 1000           # 模式B：污水上限(mL)
rv50water_left_mop_volume_min: 100        # 模式B：左拖布下限(mL)
rv50water_left_mop_volume_max: 1000       # 模式B：左拖布上限(mL)
rv50water_right_mop_volume_min: 100       # 模式B：右拖布下限(mL)
rv50water_right_mop_volume_max: 1000      # 模式B：右拖布上限(mL)

rv50water_cleaner_level_expected: 3       # 清洁剂液位；【跳过】# 注释 或写 -1
rv50water_left_mop_temp_min: 800           # 左拖布温度下限；【跳过】与 max 都写 0（勿只 # 注释）
rv50water_left_mop_temp_max: 1800          # 左拖布温度上限；【跳过】与 min 都写 0
rv50water_right_mop_temp_min: 800          # 右拖布温度下限；【跳过】与 max 都写 0
rv50water_right_mop_temp_max: 1800         # 右拖布温度上限；【跳过】与 min 都写 0
rv50water_base_hot_temp_min: 600           # 基站热水温度下限；【跳过】与 max 都写 0
rv50water_base_hot_temp_max: 1300          # 基站热水温度上限；【跳过】与 min 都写 0
rv50water_host_hot_temp_min: 300           # 主机注水口热水温度下限；【跳过】与 max 都写 0
rv50water_host_hot_temp_max: 1300          # 主机注水口热水温度上限；【跳过】与 min 都写 0

# -----------------------------------------------------------------------------
# §019  device_type=019  RV50 污水箱气密性
# -----------------------------------------------------------------------------
# [WSXQMX-019] 0x88 数据首字节：03=治具正常结束（再判保压气压）；04=治具与基站通讯失败
# [WSXQMX-019] 仅用通知区，不用测试格；保压结束帧气压判据（kPa，含端点）

wsxqmx_hold_kpa_min: -20     # 保压结束气压下限（kPa，含端点，可为负）
wsxqmx_hold_kpa_max: -17     # 保压结束气压上限（kPa，含端点，可为负）

# -----------------------------------------------------------------------------
# §106  device_type=106  称重工位
# -----------------------------------------------------------------------------
# [WEIGH-106] 未配置项使用 test.LoadCfg 默认值；详见 WEIGH_STATION_106_SPEC.md

weight_min_kg: 6.89          # 方案一固定重量下限（kg）
weight_max_kg: 6.93          # 方案一固定重量上限（kg）
weight_read_delay_sec: 1     # 扫码后延迟读秤时间（秒）
weight_read_timeout_sec: 20  # 读秤超时时间（秒）
weigh_scheme: "2"            # 称重方案："1"=全程固定上下限  "2"=前 N 台直通后 μ±kσ
weigh_pass_first_n: 5       # 方案二直通台数（代码最小 3）
weigh_sigma_k: 2.5           # 方案二动态限系数 k：下限=μ-kσ，上限=μ+kσ
weigh_history_json_path: "weigh_106_history_test.json"  # 方案二历史记录 JSON 路径；不存在则自动创建

