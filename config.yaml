# -----------------------------------------------------------------------------
# §018  device_type=018  RV50 基站 PCBA 测试
# -----------------------------------------------------------------------------
# #[RV50-018-PCBA-PROTO] 0x77 数据区 38 字节，帧长字段 0x26；0x88：03=治具正常结束；04=基站通讯失败
# 过程 0x77 实时判据失败发 0x89 0x02 并上报 MES NG（仅一次）；0x88 正常结束不回 0x89
# step1 仅占位；charge 在 step5 判据；某项上下限均为 0 表示不参与比较

rv50pcba_ir_l: 0x44          # 左红外回充码期望值（16 进制）
rv50pcba_ir_r: 0x42          # 右红外回充码期望值（16 进制）
rv50pcba_ir_n: 0x48          # 近卫红外回充码期望值（16 进制）

rv50pcba_clear_tank_expected: 0x03  # 清水箱在位状态期望值（单字节）
rv50pcba_duty_tank_expected: 0x03  # 污水箱在位状态期望值（单字节）
rv50pcba_dust_expected: 0x03       # 尘袋在位状态期望值（单字节）
rv50pcba_clean_base_expected: 0x03 # 清洁底座在位状态期望值（单字节）

rv50pcba_clean_pump_min: 50        # 清水泵电流下限（mA）
rv50pcba_clean_pump_max: 350      # 清水泵电流上限（mA）
rv50pcba_vacuum_pump_min: 3000    # 真空泵电流下限（mA）
rv50pcba_vacuum_pump_max: 4095   # 真空泵电流上限（mA）
rv50pcba_base_level_up_min: 0     # 底座液位（抬起）ADC 下限
rv50pcba_base_level_up_max: 4095  # 底座液位（抬起）ADC 上限
rv50pcba_base_level_down_min: 0   # 底座液位（按下）ADC 下限
rv50pcba_base_level_down_max: 1000 # 底座液位（按下）ADC 上限
rv50pcba_em_valve_min: 100        # 电磁三通电流下限（mA）
rv50pcba_em_valve_max: 500        # 电磁三通电流上限（mA）

rv50pcba_wash_pump_min: 50         # 清洁泵电流下限（mA）
rv50pcba_wash_pump_max: 350       # 清洁泵电流上限（mA）
rv50pcba_turbidity_min: 5000      # 浊度数据下限（ADC）
rv50pcba_turbidity_max: 15000     # 浊度数据上限（ADC）
rv50pcba_hot_diff_min: 20         # 热风温差下限
rv50pcba_hot_diff_max: 250        # 热风温差上限
rv50pcba_charge_min: 200          # 充电电流下限（mA，step5 判据）
rv50pcba_charge_max: 3000         # 充电电流上限（mA，step5 判据）
rv50pcba_blower_freq_min: 110     # 鼓风机频率下限（Hz 或协议计数）
rv50pcba_blower_freq_max: 150     # 鼓风机频率上限（Hz 或协议计数）

# -----------------------------------------------------------------------------
