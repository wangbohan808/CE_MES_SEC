#   污水通路气压        ominiair_duty_kpa_min / _max        两行都 # 或都写 0
#   基站版本            公共 mcu_version                    # 注释 或 ""
#
# 示例 — 跳过拖布通路气压：
#   # ominiair_mop_kpa_min: 20
#   # ominiair_mop_kpa_max: 230

# ominiair_clear_kpa_min: 20    # 清水通路气压下限；【跳过】与 max 成对 # 或都写 0
