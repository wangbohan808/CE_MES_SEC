rv50_clean_pump_min: 50        # 清水泵电流下限；【跳过】与 max 成对 # 或都写 0
rv50_clean_pump_max: 350       # 清水泵电流上限；【跳过】与 min 成对 # 或都写 0
rv50_vacuum_pump_min: 50      # 真空泵电流下限；【跳过】与 max 成对 # 或都写 0
rv50_vacuum_pump_max: 200     # 真空泵电流上限；【跳过】与 min 成对 # 或都写 0
rv50_base_level_up_min: 3000  # 底座液位抬起下限；【跳过】与 max 成对 # 或都写 0
rv50_base_level_up_max: 4095  # 底座液位抬起上限；【跳过】与 min 成对 # 或都写 0
rv50_base_level_down_min: 0   # 底座液位按下下限；【跳过】与 max 成对 # 或都写 0
rv50_base_level_down_max: 1000 # 底座液位按下上限；【跳过】与 min 成对 # 或都写 0
rv50_em_valve_min: 100        # 电磁三通下限；【跳过】与 max 成对 # 或都写 0
rv50_em_valve_max: 500        # 电磁三通上限；【跳过】与 min 成对 # 或都写 0

