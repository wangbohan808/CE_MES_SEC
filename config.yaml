# -----------------------------------------------------------------------------
# §019  device_type=019  RV50 污水箱气密性
# -----------------------------------------------------------------------------
# [WSXQMX-019] 0x88 数据首字节：03=治具正常结束（再判保压气压）；04=治具与基站通讯失败
# [WSXQMX-019] 仅用通知区，不用测试格；保压结束帧气压判据（kPa，含端点）

wsxqmx_hold_kpa_min: -20
wsxqmx_hold_kpa_max: -17

# -----------------------------------------------------------------------------
# §106  device_type=106  称重工位
# -----------------------------------------------------------------------------
# [WEIGH-106] 未配置项使用 test.LoadCfg 默认值；详见 WEIGH_STATION_106_SPEC.md

weight_min_kg: 6.89
weight_max_kg: 6.93
weight_read_delay_sec: 1
weight_read_timeout_sec: 20
weigh_scheme: "2"              # "1" 全程固定上下限；"2" 前 N 台直通后 μ±kσ
weigh_pass_first_n: 5          # 方案二直通台数（代码最小 3）
weigh_sigma_k: 2.5             # 方案二动态限系数 k：下限=μ-kσ，上限=μ+kσ（一位小数，如 2.5）
weigh_history_json_path: "weigh_106_history_test.json"  # 方案二历史 JSON；不存在则自动创建

# -----------------------------------------------------------------------------
# §103  device_type=103  配件纸箱条码检测
# -----------------------------------------------------------------------------
# SN 前 7 位固定头（与扫码规则一致）

parts_sn_head: "2242G06"
