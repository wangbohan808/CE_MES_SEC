# -----------------------------------------------------------------------------
# §016  device_type=016  RV50 基站过水测试
# -----------------------------------------------------------------------------
# #[RV50-016-WATER-PROTO] 0x77 数据区 22 字节：原 16 字节 + dat[16..18]基站版本 + dat[19..21]基站配置码
# 四路水量 u16==期望值；清洁剂液位单字节==期望值；温度为 ADC（含端点）
# 基站版本/配置码阈值见公共 mcu_version、base_station_config_expected
