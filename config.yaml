# =============================================================================
# CE_MES 治具配置
# 修改 device_type 切换工位；专项参数见下方对应章节（启动时均会读入，仅对应工位生效）。
# 加载入口：test_tool/test.py → load_config()
# =============================================================================

# -----------------------------------------------------------------------------
# 公共配置（所有工位）
# -----------------------------------------------------------------------------
device_type: "016"          # 当前工位编号（三位字符串），完整列表见下方索引
project_name: "RV50"       # 窗口标题前缀（如 HW1、RV50、Omini）
use_mes: "2"                # MES 上报：1=海能+安克  2=仅海能  3=仅安克
user_com: ""                # 串口 COM 号（如 COM3）；留空则自动识别（需唯一可用口）
mcu_version: "005.001.013"  # 【跳过】行首加 # 注释整行，或改为 "" → 不显示「MCU/基站版本」格、不参与比对、不上报 MES
base_station_config_expected: "FF.FF.FF"  # 基站配置码期望值（十六进制 XX.XX.XX）
show_base_station_config_ui: 0          # 仅控制「基站配置码」测试格是否显示：0=隐藏  1=显示（不改变是否参与判据）
# test_tool: "治具未编码"   # 治具名称/编码（海能 MES，可选）

# -----------------------------------------------------------------------------
# 【测试项跳过说明 — 工人操作必读】
# -----------------------------------------------------------------------------
# 1. 修改本文件后须保存并重启程序（python main.py），否则界面不会更新。
# 2. 跳过某项后：测试格不显示、不参与 PASS/NG、不上报 MES（跳过不算失败）。
# 3. 区间类（电流/气压/温度/ADC 等）必须「上限、下限」成对处理，只改一行可能仍会显示并测试。
# 4. 两种等价写法（任选其一）：
#      写法 A：在配置行最前面加 # 注释掉整行
#      写法 B：把该行改成下方各节写的「跳过哨兵值」
# 5. 各工位跳过规则见下方 §015 / §016 / §017 / §020 / §021 / §022 章节内清单。
# 6. 特殊注意（仅 RV50，Omini 无此问题）：
#      §015 过气：气压项不能仅靠 # 注释，须把 min 与 max 都写成 0
#      §016 过水：温度项 / 水量区间(min/max) 不能仅靠 # 注释，须都写成 0；
#               水量精确(expected) / 液位 可 # 或写 -1（详见 §016 水量双模式说明）

# -----------------------------------------------------------------------------
# device_type 索引（三位字符串，与 ui/MainFrame.py heading_line_dict 一致）
# -----------------------------------------------------------------------------
# --- 主板治具 dev < 100（海能串口协议）---
#   001  过水测试（旧线）          002  充电座测试
#   003  前撞组件                  004  前撞 PCB
#   005  地检组件                  006  集尘桶 PCB
#   007  静态电流                  010  左轮    011  右轮
#   012  边刷摆臂                  013  中扫
#   015  RV50 基站过气测试         → §015（帧设备字节 0x0F）；0x77 数据区 13 字节；0x57 下发 + 0x77 回读比对
#   016  RV50 基站过水测试         → §016（帧设备字节 0x10）；0x77 数据区 24 字节；0x88：03 正常结束 / 04 基站通讯失败
#   017  RV50 基站全功能测试       → §017（帧设备字节 0x11）；0x88：03 正常结束 / 04 基站通讯失败
#   018  RV50、Omini 基站 PCBA 测试       → §018（帧设备字节 0x12）；0x88：03 正常结束 / 04 基站通讯失败
#   019  RV50 污水箱气密性         → §019（帧设备字节 0x13）；0x88：03 正常结束 / 04 基站通讯失败
#   050  RV30 基站全功能/双红外   → §050（帧设备字节 0x32）；0x88：03 正常结束 / 04 基站通讯失败
# --- 上位机工具 dev ≥ 100（非标准治具协议）---
#   100  绑定主机、前撞、电池      101  打高压（耐压）
#   102  条码比对                  103  配件纸箱条码  → §103
#   104  打高压 ZC7122D            105  耐高压
#   106  称重工位                  → §106
# --- Omini 基站（帧格式同 RV50 对应工位，判据独立 omini_* / ominiair_* / ominiwater_*）---
#   020  Omini 基站全功能测试      → §020（帧设备字节 0x14）；0x77 数据区 38 字节；0x88：03 正常结束 / 04 基站通讯失败
#   021  Omini 基站过气测试        → §021（帧设备字节 0x15）；0x77 数据区 13 字节；0x57 下发 + 0x77 回读比对
#   022  Omini 基站过水测试        → §022（帧设备字节 0x16）；0x77 数据区 22 字节；0x88：03 正常结束 / 04 基站通讯失败

# =============================================================================
# 专项配置（按工位）
# =============================================================================

# -----------------------------------------------------------------------------
# §050  device_type=050  RV30 基站全功能（双红外成品检测）
# -----------------------------------------------------------------------------
# [RV30-PROTO] 0x88 数据首字节：03=治具正常结束（上位机再综合判定 PASS/NG）
#                   04=治具与基站通讯失败（专用提示 + MES NG，不跑全项终判）
# [RV30-PROTO] 0x77 实时/终判阈值；某项上下限均为 0 表示不参与比较。
# 治具发 0x68 后可覆盖下列运行时阈值（见 test.py rv30_proto_parse_68_dat）。
# 调优：test.py rv30_proto_yaml_realtime_ok / rv30_proto_yaml_finalize_ok

rv30_charge_min: 100         # 充电电流下限（治具 0x77 原始计数）
rv30_charge_max: 200         # 充电电流上限（治具 0x77 原始计数）

rv30_suction_kpa_min: 10      # 集尘吸力下限（kPa，含端点；治具帧内为 kPa×100）
rv30_suction_kpa_max: 30      # 集尘吸力上限（kPa，含端点）

rv30_freq_expected: 0x32      # 过零频率期望值（16 进制；0=不参与比较）

rv30_ir_l: 0x50               # 左红外回充码期望值（16 进制）
rv30_ir_lc: 0x44              # 左中红外回充码期望值（16 进制）
rv30_ir_rc: 0x42              # 右中红外回充码期望值（16 进制）
rv30_ir_r: 0x48               # 右红外回充码期望值（16 进制）

rv30_dust_bag_expected: 0x03  # 尘袋在位状态期望值（单字节）
rv30_led_expected: 0x03       # LED 状态期望值（单字节）

# -----------------------------------------------------------------------------
# §017  device_type=017  RV50 基站全功能测试
# -----------------------------------------------------------------------------
# #[RV50-017-PROTO] 0x77 数据区 38 字节；0x88：03=正常结束  04=基站通讯失败
#
# 【逐项跳过 — 不显示 UI】（# 注释成对键 或 写哨兵值，修改后重启程序）
#   测试项              配置键                              跳过操作
#   MCU 版本            公共 mcu_version                    # 注释 或 ""
#   充电电流            rv50_charge_min / _max              两行都 # 或都写 0
#   左/右/近卫回充码    rv50_ir_l / _r / _n                 # 注释 或写 0
#   清水箱在位          rv50_clear_tank_expected            # 注释 或写 0（步骤四不再提示装清水箱）
#   污水箱在位          rv50_duty_tank_expected             同上
#   尘袋                rv50_dust_expected                  同上
#   清洁底座在位        rv50_clean_base_expected            同上
#   集尘吸力            rv50_suction_kpa_min / _max         两行都 # 或都写 0
#   清水泵电流          rv50_clean_pump_min / _max          两行都 # 或都写 0
#   真空泵电流          rv50_vacuum_pump_min / _max         两行都 # 或都写 0
#   底座液位(抬起)      rv50_base_level_up_min / _max       两行都 # 或都写 0
#   底座液位(按下)      rv50_base_level_down_min / _max     两行都 # 或都写 0
#   电磁三通电流        rv50_em_valve_min / _max            两行都 # 或都写 0
#   清洁泵电流          rv50_wash_pump_min / _max           两行都 # 或都写 0
#   浊度                rv50_turbidity_min / _max           两行都 # 或都写 0
#   热风差值            rv50_hot_diff_min / _max            两行都 # 或都写 0
#   热风开始/结束       （无独立键，跟随热风差值）          跳过 hot_diff 即一并隐藏

rv50_charge_min: 200          # 充电电流下限；【跳过】与 max 成对 # 或都写 0
rv50_charge_max: 3000         # 充电电流上限；【跳过】与 min 成对 # 或都写 0

rv50_ir_l: 0x44               # 左回充码；【跳过】# 注释 或写 0
rv50_ir_r: 0x42               # 右回充码；【跳过】# 注释 或写 0
rv50_ir_n: 0x48               # 近卫回充码；【跳过】# 注释 或写 0

rv50_clear_tank_expected: 0x03 # 清水箱在位；【跳过】# 注释 或写 0
rv50_duty_tank_expected: 0x03 # 污水箱在位；【跳过】# 注释 或写 0
rv50_dust_expected: 0x03       # 尘袋；【跳过】# 注释 或写 0
rv50_clean_base_expected: 0x03 # 清洁底座在位；【跳过】# 注释 或写 0

rv50_suction_kpa_min: 17      # 集尘吸力下限；【跳过】与 max 成对 # 或都写 0
